<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0f12;font-family:Inter,sans-serif;color:#e8eaed;padding:32px;width:1200px}
h1{font:700 18px Inter;letter-spacing:.2em;color:#8a9099;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{background:#14171c;border-radius:14px;padding:22px 16px;text-align:center;
  background-image:linear-gradient(#1b1f25 1px,transparent 1px),linear-gradient(90deg,#1b1f25 1px,transparent 1px);background-size:20px 20px}
.mark{height:120px;display:flex;align-items:center;justify-content:center}
.name{font:400 30px Anton;letter-spacing:.04em;text-transform:uppercase;margin-top:10px}
.handle{font:500 13px Inter;color:#8a9099;margin-top:4px}
.sw{display:flex;gap:6px;justify-content:center;margin-top:12px}
.sw span{width:22px;height:22px;border-radius:4px;display:inline-block}
.n{font:700 12px Inter;color:#8a9099;letter-spacing:.2em}
</style></head><body>
<h1>BRAND OPTIONS — ROUGH MARKS, NOT FINAL ART</h1>
<div class="grid">
 <div class="card"><div class="n">1</div><div class="mark">
  <svg width="110" height="110" viewBox="0 0 110 110"><path d="M15 95 L55 15 L95 95" fill="none" stroke="#f2f2f2" stroke-width="9" stroke-linejoin="miter"/><path d="M55 95 L80 45" stroke="#C6FF3D" stroke-width="9"/><circle cx="80" cy="45" r="7" fill="#C6FF3D"/></svg>
 </div><div class="name">Angle <span style="color:#C6FF3D">Theory</span></div><div class="handle">@angletheoryapp</div>
 <div class="sw"><span style="background:#0d0f12;border:1px solid #333"></span><span style="background:#f2f2f2"></span><span style="background:#C6FF3D"></span><span style="background:#3a3f48"></span></div></div>

 <div class="card"><div class="n">2</div><div class="mark">
  <svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="40" fill="none" stroke="#f2f2f2" stroke-width="8"/><path d="M10 80 Q55 20 100 30" fill="none" stroke="#FF5A4E" stroke-width="9" stroke-linecap="round"/></svg>
 </div><div class="name">Slip<span style="color:#FF5A4E">line</span></div><div class="handle">@sliplineapp</div>
 <div class="sw"><span style="background:#0d0f12;border:1px solid #333"></span><span style="background:#f2f2f2"></span><span style="background:#FF5A4E"></span><span style="background:#2b3240"></span></div></div>

 <div class="card"><div class="n">3</div><div class="mark">
  <svg width="110" height="110" viewBox="0 0 110 110"><path d="M20 25 L40 55 L20 85 M45 25 L65 55 L45 85" fill="none" stroke="#f2f2f2" stroke-width="9" stroke-linecap="square"/><path d="M70 25 L90 55 L70 85" fill="none" stroke="#FF8A1F" stroke-width="9" stroke-linecap="square"/></svg>
 </div><div class="name">Out<span style="color:#FF8A1F">fox</span></div><div class="handle">@outfoxboxing</div>
 <div class="sw"><span style="background:#0d0f12;border:1px solid #333"></span><span style="background:#f2f2f2"></span><span style="background:#FF8A1F"></span><span style="background:#33363d"></span></div></div>

 <div class="card"><div class="n">4</div><div class="mark">
  <svg width="110" height="110" viewBox="0 0 110 110"><rect x="18" y="18" width="74" height="74" fill="none" stroke="#f2f2f2" stroke-width="8" transform="rotate(45 55 55)"/><circle cx="55" cy="55" r="11" fill="#2EE6D6"/></svg>
 </div><div class="name">Ring<span style="color:#2EE6D6">craft</span></div><div class="handle">@ringcraftapp</div>
 <div class="sw"><span style="background:#0d0f12;border:1px solid #333"></span><span style="background:#f2f2f2"></span><span style="background:#2EE6D6"></span><span style="background:#2a3038"></span></div></div>

 <div class="card"><div class="n">5</div><div class="mark">
  <svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="38" fill="none" stroke="#3a3f48" stroke-width="6" stroke-dasharray="6 7"/><path d="M55 17 A38 38 0 0 1 93 55" fill="none" stroke="#8B7CFF" stroke-width="9" stroke-linecap="round"/><circle cx="55" cy="55" r="9" fill="#f2f2f2"/></svg>
 </div><div class="name">Pivot <span style="color:#8B7CFF">Lab</span></div><div class="handle">@pivotlabapp</div>
 <div class="sw"><span style="background:#0d0f12;border:1px solid #333"></span><span style="background:#f2f2f2"></span><span style="background:#8B7CFF"></span><span style="background:#2f2c40"></span></div></div>
</div></body></html>
